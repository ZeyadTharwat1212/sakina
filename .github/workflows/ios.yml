name: iOS (TestFlight / App Store)
# Every push: builds the iPhone app on a free GitHub macOS runner (compile check, no signing).
# When the App Store Connect API key secrets exist, it also signs (automatic signing via the key),
# archives and uploads the build to App Store Connect → TestFlight.
# Secrets (Settings → Secrets and variables → Actions):
#   ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (contents of the AuthKey_XXXX.p8 file), APPLE_TEAM_ID
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/ios.yml']
concurrency: { group: ios, cancel-in-progress: true }
jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Web build + sync into iOS
        working-directory: app
        run: |
          set -o pipefail
          report() { echo "::error title=web build::$(tail -40 web.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"; exit 1; }
          { npm ci && npm run build && npx cap sync ios; } 2>&1 | tee web.log || report
      - name: Xcode
        run: |
          # App Store Connect requires the iOS 26 SDK (Xcode 26) since April 2026
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1); [ -n "$X" ] || X=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$X"
          xcodebuild -version
      - name: Compile check (simulator, unsigned)
        working-directory: app/ios/App
        run: |
          set -o pipefail
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log | grep -E "error:|warning: .*(Sakina|AppDelegate)|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log || { echo "::error title=xcodebuild::$(grep -E 'error:' build.log | head -25 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"; exit 1; }
      - name: Archive + upload to App Store Connect
        if: env.ASC_KEY_ID != '' && env.ASC_ISSUER_ID != '' && env.ASC_KEY_P8 != '' && env.APPLE_TEAM_ID != ''
        working-directory: app/ios/App
        run: |
          set -o pipefail
          KEY="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"; printf '%s' "$ASC_KEY_P8" > "$KEY"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Sakina.xcarchive" DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} "${AUTH[@]}" archive 2>&1 | grep -E "error:|ARCHIVE (SUCCEEDED|FAILED)"
          /usr/libexec/PlistBuddy -c "Add :teamID string $APPLE_TEAM_ID" ExportOptions.plist
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Sakina.xcarchive" -exportOptionsPlist ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" "${AUTH[@]}" 2>&1 | grep -E "error:|Upload|EXPORT (SUCCEEDED|FAILED)"
      - name: Build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: app/ios/App/build.log
          if-no-files-found: ignore
